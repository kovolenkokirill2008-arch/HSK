<title>HSK 3 — 600 слов</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14202e;--mut:#6a7886;--ok:#0f8b6d;--bad:#d1495b;--line:#d9e0e6;--pri:#1f3a5f;--onpri:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#172331;--ink:#e8eef4;--mut:#8fa0b0;--ok:#34c79f;--bad:#f0707f;--line:#2a3a4c;--pri:#7fb0e8;--onpri:#0e1620}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#172331;--ink:#e8eef4;--mut:#8fa0b0;--ok:#34c79f;--bad:#f0707f;--line:#2a3a4c;--pri:#7fb0e8;--onpri:#0e1620}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh}
#app{width:min(100%,760px);margin:0 auto;padding:12px 14px calc(92px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;z-index:10;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 24px),456px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 6px 24px #0002}
nav button{min-width:0;border:0;background:none;color:var(--mut);font:600 12px inherit;padding:7px 3px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button.on{background:var(--pri);color:var(--onpri)}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px 0 12px;padding:3px 0}
.subnav button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:10px 12px;font:600 14px inherit}
.subnav button.on{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:500 14px inherit}
.chip.on{border-color:var(--pri);color:var(--pri);font-weight:700}
.cnt{text-align:center;color:var(--mut);font-size:14px;margin:6px 0}
.stage{height:360px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.card{position:relative;width:100%;height:340px;background:var(--card);border:2px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;user-select:none;touch-action:pan-y;cursor:grab;transition:transform .2s}
.hz{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;font-size:76px;line-height:1.1;font-weight:700;word-break:keep-all}
.py{font-size:26px;color:var(--pri);font-weight:600}
.tr{font-size:24px;line-height:1.3}
.card .tr.f{font-size:32px;font-weight:600}
.spk{position:absolute;right:12px;top:12px;border:0;background:none;font-size:24px;padding:8px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button,.big{flex:1;border:0;border-radius:14px;padding:16px;font:700 17px inherit;color:#fff}
.no{background:var(--bad)}.yes{background:var(--ok)}
.big{background:var(--pri);color:var(--onpri)}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 0}
.done{text-align:center;padding:60px 10px}.done .big{width:100%;margin-top:18px}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qh{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.q{text-align:center;padding:26px 0 18px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.q .hz{font-size:84px}.q .tr{font-size:30px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:15px;font:500 18px inherit;text-align:center}
.opt .oh{font-family:"Songti SC","Noto Serif SC",serif;font-size:30px;font-weight:700}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.ban{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:16px;padding:14px;border-radius:14px;border:2px solid}
.ban.ok{border-color:var(--ok)}.ban.bad{border-color:var(--bad)}
.ban b{font-size:17px}.ban div div{font-size:14px;color:var(--mut);margin-top:3px}
.ban .big{flex:none;padding:12px 18px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center}
.st b{display:block;font-size:28px}.st span{font-size:13px;color:var(--mut)}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.rst{width:100%;margin-top:22px;background:none;border:2px solid var(--bad);color:var(--bad);border-radius:14px;padding:14px;font:600 16px inherit}
[hidden]{display:none!important}
.btns .clr{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:16px 18px}
.wq{text-align:center;margin-top:10px}
.pad{position:relative;width:100%;aspect-ratio:1.25;background-color:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;margin:10px 0;background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","Noto Serif SC",serif;font-weight:700;color:var(--pri);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.ghost.on{opacity:.4}
.sq{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:16px inherit;margin:4px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:7px 0}
.row summary{display:flex;align-items:center;gap:10px;padding:10px 12px;list-style:none;cursor:pointer}
.row summary::-webkit-details-marker{display:none}
.rh{font-family:"Songti SC","Noto Serif SC",serif;font-size:26px;font-weight:700;min-width:64px}
.rt{flex:1;font-size:15px;line-height:1.35}.rt b{color:var(--pri);font-weight:600}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--mut);font:700 16px inherit;flex:none;padding:0}
.dot.s1{border-color:var(--ok);color:var(--ok)}.dot.s2{border-color:var(--bad);color:var(--bad)}
.rb{padding:0 12px 12px;display:grid;gap:8px}
.rb textarea,.io{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:15px inherit;resize:vertical}
.h3{margin:26px 0 6px;font-size:17px}
.left{text-align:left}
#toast{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
button:disabled{opacity:.6}
.spk-card{background:var(--card);border:2px solid var(--line);border-radius:22px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;margin:8px 0 12px}
.py.big{font-size:46px}
.hintbox{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.hintbox .hz{font-size:60px}
.skip{width:100%;margin-top:12px;background:none;border:0;color:var(--mut);text-decoration:underline;font:15px inherit;padding:10px}

#bar{display:flex;justify-content:space-between;gap:6px;margin:8px 2px 0;font-size:13px;font-weight:600;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.qst{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.qst.dn{border-color:var(--ok)}.qt{display:flex;justify-content:space-between;font-size:15px}
.qst .prog{margin:8px 0 4px}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;opacity:.4}
.bg.on{opacity:1;border-color:var(--ok)}.bg b{display:block;font-size:20px}.bg span{font-size:12px;color:var(--mut)}

.ly{display:inline-flex;gap:6px;vertical-align:middle;margin:4px}.ly.c{flex-direction:column}

.sl.f{border:2px solid var(--ok)}.sl.q{border:2px solid var(--pri);color:var(--pri)}
.pzw{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin:18px 0;gap:4px}.wc{font-size:64px}.wc.ok{color:var(--ok)}

.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.mc{display:flex;flex-direction:column;gap:10px}

.mtile.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.mtile.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));opacity:.55}
.mtile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}

  #app{width:min(100%,1200px);max-width:1200px;padding:24px 28px;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr auto;align-items:start;gap:0 28px}
  nav{position:sticky;left:auto;bottom:auto;transform:none;width:auto;grid-column:1;grid-row:1/4;display:flex;flex-direction:column;align-items:stretch;gap:6px;border-radius:18px;padding:10px;box-shadow:none}
  nav button{flex:none;width:100%;min-height:52px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;text-align:left;font-size:15px}
  nav button svg{width:21px;height:21px}
  #bar,#main,#ext{grid-column:2}
  #main{width:100%;max-width:860px}
  #ext{justify-self:start}
  #toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}

  return c+p?Math.round(200*c*p/(c+p)):0;
}
function wans(k){S.st[wd[wp]]=k?1:2;grade(wd[wp],k);wp++;rWrite()}

/* ---- Речь ---- */
let sd=[],sp=0,rec=null,G={tries:0,res:null,pass:false,on:false};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function mkS(){sd=sh(all().filter(i=>inF(i)));sp=0}
function startWord(){
  G={tries:0,res:null,pass:false,on:wantMic};
  if(sp<sd.length)say(sd[sp]);
  rSpeak();
}
function rSpeak(){
  if(S.tab!=='speak')return;
  let h=`<div class="subnav">${practiceModes()}</div><div class="chips">${fchips()}</div>`;
  if(sp>=sd.length){
    h+=`<div class="done"><h2>${sd.length?'Все слова произнесены':'Здесь пока пусто'}</h2><p class="hint">${sd.length?'Пропущенные слова попали в «Не знаю».':'Выберите другой фильтр.'}</p><button class="big" data-a="sagain">Начать заново</button></div>`;
  }else{
    const i=sd[sp],[c,p,t]=D[i],rv=G.pass||G.tries>=2,r=G.res;
    let ban='';
    if(r){
      ban=r.err?`<div class="ban bad"><div><b>${r.msg}</b></div></div>`
       :r.pass?`<div class="ban ok"><div><b style="font-size:22px">Правильно! ${r.score}%</b></div></div>`
       :`<div class="ban bad"><div><b style="font-size:22px">Похоже на ${r.score}%</b><div>Я услышал: «${esc(r.heard||'…')}». Попробуйте ещё раз.</div></div></div>`;
    }
    h+=`<div class="cnt">${sp+1} из ${sd.length}</div>
    <div class="spk-card"><div class="py big">${p}</div><div class="hintbox">${rv?`<div class="hz">${c}</div><div class="tr">${esc(t)}</div>`:`<div class="hint">${G.on?'Слушаю… говорите':'Послушайте слово и повторите вслух'}</div>`}</div></div>
    ${ban}
    <div class="btns" style="margin-top:12px"><button class="clr" data-a="sspk">🔊 Слушать</button>${G.pass?'<button class="big" data-a="snext">Дальше</button>':`<button class="${G.on?'no':'yes'}" data-a="smic">${G.on?'⏹ Выключить микрофон':'🎤 Включить микрофон'}</button>`}</div>
    ${!G.pass&&G.tries>=3?'<button class="skip" data-a="sskip">Пропустить слово</button>':''}
    <p class="hint">Включите микрофон один раз: он слушает, пока вы на этой вкладке. Пока слово не произнесено правильно, дальше не пустит. После двух ошибок появится подсказка.</p>`;
  }
  $('#main').innerHTML=h;
}
const clean=s=>s.replace(/[\s，。！？、,.!?;:：；…~"“”'‘’-]/g,'');
const NUM={0:'零',1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',100:'百',1000:'千',10000:'万'};
const normNum=t=>/^\d+$/.test(t)&&NUM[+t]?NUM[+t]:t;
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function judge(alts){
  const target=D[sd[sp]][0];let pass=false,top=0,heard=alts[0]?alts[0][0]:'';
  for(const [tx,cf] of alts){if(same(normNum(clean(tx)),target)){pass=true;top=Math.max(top,Math.round(70+30*(cf>0?cf:.9)));heard=tx}}
  if(!pass)for(const [tx] of alts){const t=normNum(clean(tx)),sim=1-lev(t,target)/Math.max(t.length,target.length,1);top=Math.max(top,Math.min(69,Math.round(sim*70)))}
  G.tries++;G.pass=pass;G.res={pass,score:top,heard};
  const i=sd[sp];
  if(pass&&G.tries===1)S.st[i]=1;else if(!pass&&G.tries>=3)S.st[i]=2;
  save();
}
let wantMic=false;
const same=(t,g)=>t===g||(t.length>g.length&&t.length%g.length===0&&g.repeat(t.length/g.length)===t);
function micStart(){
  if(!SR){G.res={err:1,msg:'Этот браузер не умеет распознавать речь. Откройте приложение в Chrome (Android, компьютер) или Safari (iPhone).'};rSpeak();return}
  wantMic=true;G.on=true;G.res=null;rSpeak();
  try{makeRec()}catch(_){wantMic=false;G.on=false;G.res={err:1,msg:'Не удалось включить микрофон.'};rSpeak()}
}
function micStop(){wantMic=false;G.on=false;try{if(rec)rec.abort()}catch(_){}rSpeak()}
function makeRec(){
  rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=5;
  rec.onresult=e=>{
    let used=false;
    for(let k=e.resultIndex;k<e.results.length;k++){
      const r=e.results[k];
      if(!r.isFinal||S.tab!=='speak'||G.pass||sp>=sd.length||speechSynthesis.speaking||Date.now()<muteUntil)continue;
      judge([...r].map(a=>[a.transcript,a.confidence]));used=true;
    }
    if(used)rSpeak();
  };
  rec.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    wantMic=false;G.on=false;
    G.res={err:1,msg:e.error==='not-allowed'||e.error==='service-not-allowed'?'Нет доступа к микрофону. В Chrome нажмите на значок слева от адреса, откройте «Разрешения» и включите микрофон. Если страница открыта внутри другого приложения, откройте её в самом Chrome.':e.error==='network'?'Нет связи с сервисом распознавания речи.':'Не удалось распознать. Попробуйте ещё раз.'};
    rSpeak();
  };
  rec.onend=()=>{
    if(wantMic&&S.tab==='speak'){
      setTimeout(()=>{if(wantMic&&S.tab==='speak'){try{makeRec()}catch(_){wantMic=false;G.on=false;rSpeak()}}},250);
    }else if(G.on){G.on=false;rSpeak()}
  };
  rec.start();
}

/* ---- Слова ---- */
let wq='',ws='all';
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const N=D.map(d=>norm(d[1]));
const DOT={0:'○',1:'✓',2:'✗'};
function rowH(i){
  const [c,p,t]=D[i],s=S.st[i]||0,n=(S.notes||{})[i]||'';
  return `<details class="row"><summary><button class="dot s${s}" data-a="cyc" data-v="${i}" aria-label="Сменить статус">${DOT[s]}</button><span class="rh">${c}</span><span class="rt"><b>${p}</b><br>${esc(t)}</span><span class="nt">${n?'📝':''}</span></summary><div class="rb"><textarea data-i="${i}" placeholder="Заметка: ассоциация, пример…">${esc(n)}</textarea><button class="chip" data-a="spk2" data-v="${i}">🔊 Озвучить</button></div></details>`;
}
function fillList(){
  const q=wq.trim().toLowerCase(),nq=norm(q),nt=S.notes||{};
  const idx=all().filter(i=>{
    if(wcat&&CATN[CATI[i]]!==wcat)return false;if(ws!=='all'&&String(S.st[i]||0)!==ws)return false;
    if(!q)return true;
    return D[i][0].includes(q)||N[i].includes(nq)||D[i][2].toLowerCase().includes(q)||(nt[i]||'').toLowerCase().includes(q);
  });
  $('#list').innerHTML=`<div class="cnt">Найдено: ${idx.length}</div>`+idx.slice(0,150).map(rowH).join('')+(idx.length>150?'<p class="hint">Показаны первые 150. Уточните поиск.</p>':'');
}
function rWords(){
  $('#main').innerHTML=catRow()+`<div class="chips">${[['all','Все'],['1','Знаю'],['2','Не знаю'],['0','Новые']].map(([k,l])=>`<button class="chip ${ws===k?'on':''}" data-a="ws" data-v="${k}">${l}</button>`).join('')}</div><input id="sq" class="sq" type="search" placeholder="Поиск: иероглиф, пиньинь или перевод" value="${esc(wq)}"><div id="list"></div><p class="hint">Кружок слева меняет статус. Нажмите на слово, чтобы добавить заметку.</p>`;
  $('#sq').oninput=e=>{wq=e.target.value;fillList()};fillList();
}

/* ---- Прогресс ---- */
let rs=false,msg='';
function rStats(){
  const v=Object.values(S.st),k=v.filter(x=>x===1).length,u=v.filter(x=>x===2).length,n=D.length-k-u,p=x=>x/D.length*100;
  $('#main').innerHTML=rPanel()+`<div class="st"><div><b style="color:var(--ok)">${k}</b><span>Знаю</span></div><div><b style="color:var(--bad)">${u}</b><span>Не знаю</span></div><div><b>${n}</b><span>Новые</span></div></div>
  <div class="stack"><i style="width:${p(k)}%;background:var(--ok)"></i><i style="width:${p(u)}%;background:var(--bad)"></i></div>
  <p class="hint">Выучено ${Math.round(p(k))}% из ${D.length} слов</p>
  <h3 class="h3">Перенос прогресса</h3><p class="hint left">Нажмите «Экспорт», скопируйте код и вставьте его на другом устройстве в это поле, затем нажмите «Импорт». Код включает статусы и заметки.</p>
  <textarea id="io" class="io" placeholder="Код прогресса"></textarea>
  <div class="btns"><button class="big" data-a="exp">Экспорт</button><button class="big" data-a="imp">Импорт</button></div><p class="hint">${msg}</p>
  <button class="rst" data-a="reset">${rs?'Нажмите ещё раз, чтобы стереть прогресс':'Сбросить прогресс'}</button>`;
}

function go(){bar();{const x=$('#ext');if(x)x.hidden=!(TG&&S.tab==='speak')}
  wantMic=false;try{if(rec)rec.abort()}catch(_){}
  const section=['quiz','write','speak'].includes(S.tab)?'practice':S.tab==='cards'?'learn':S.tab;
  document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.section===section;b.classList.toggle('on',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(S.tab==='cards'){if(!deck.length&&pos===0)mk();rCards()}
  else if(S.tab==='quiz'){Q?rQuiz():startQ()}
  else if(S.tab==='write'){if(!wd.length&&wp===0)mkW();rWrite()}
  else if(S.tab==='speak'){if(!sd.length&&sp===0)mkS();startWord()}
  else if(S.tab==='words')rWords();
  else rStats();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='section'){
    const section=b.dataset.section;
    S.tab=section==='learn'?'cards':section==='practice'?(['quiz','write','speak'].includes(S.tab)?S.tab:'quiz'):section;
    save();rs=false;msg='';go()
  }
  else if(a==='tab'){S.tab=v;save();rs=false;msg='';go()}
  else if(a==='f'){S.f=v;save();if(S.tab==='write'){mkW();rWrite()}else if(S.tab==='speak'){mkS();startWord()}else{mk();rCards()}}
  else if(a==='dir'){S.dir=1-S.dir;save();S.tab==='quiz'?startQ():rCards()}
  else if(a==='no')ans(false);
  else if(a==='yes')ans(true);
  else if(a==='again'){mk();rCards()}
  else if(a==='opt')pick(+v);
  else if(a==='next'){Q.i++;Q.pick=null;if(Q.i<Q.list.length)mkOpts();rQuiz()}
  else if(a==='qs')startQ(v);
  else if(a==='wshow'){
    const pc=match($('#cv'),D[wd[wp]][0]),sc=$('#sc');
    sc.className='ban '+(pc>=60?'ok':'bad');
    sc.innerHTML=`<div><b style="font-size:22px">Совпадение ${pc}%</b><div>${pc>=75?'Отлично, форма очень похожа':pc>=50?'Неплохо, форма похожа':pc?'Пока не похоже, попробуйте ещё раз':'Вы ничего не нарисовали'}</div></div>`;
    sc.hidden=false;say(wd[wp]);$('#gh').classList.add('on');$('#b1').hidden=true;$('#b2').hidden=false}
  else if(a==='wclr'){$('#cv').clear()}
  else if(a==='wyes')wans(true);
  else if(a==='wno')wans(false);
  else if(a==='wagain'){mkW();rWrite()}
  else if(a==='ws'){ws=v;rWords()}
  else if(a==='sspk')say(sd[sp]);
  else if(a==='smic')wantMic?micStop():micStart();
  else if(a==='snext'){sp++;startWord()}
  else if(a==='sskip'){S.st[sd[sp]]=2;grade(sd[sp],false);sp++;startWord()}
  else if(a==='sagain'){mkS();startWord()}
  else if(a==='cyc'){e.preventDefault();const i=+v,n=((S.st[i]||0)+1)%3;if(n===0)delete S.st[i];else S.st[i]=n;S.ts=Date.now();save();b.className='dot s'+n;b.textContent=DOT[n]}
  else if(a==='spk2')say(+v);
  else if(a==='spk')say(deck[pos]);
  else if(a==='spkq')say(Q.list[Q.i]);
  else if(a==='wc'){wcat=v;rWords()}
  else if(a==='learn'){S.cat=wcat;S.f='all';S.tab='cards';save();rst0();go()}
  else if(a==='catx'){S.cat='';save();rst0();go()}
  else if(a==='wm'){S.wm=v;save();pz=null;go()}
  else if(a==='pzp')pzTap(+v)
  else if(a==='pznext'){pzp++;pz=null;rPz()}
  else if(a==='pzagain'){pzd=[];pzp=0;pz=null;rPz()}
  else if(a==='qm'){S.qm=v;save();M=null;Q=null;go()}
  else if(a==='mt')mTap(v)
  else if(a==='ms'){S.ms=((S.ms||0)+1)%3;save();rMatch()}
  else if(a==='ext'){try{TG.openLink(location.href)}catch(_){}}
  else if(a==='exp'){
    const code=btoa(unescape(encodeURIComponent(JSON.stringify({st:S.st,notes:S.notes||{},sr:S.sr,xp:S.xp,days:S.days,best:S.best}))));
    const io=$('#io');io.value=code;io.select();
    const m=document.querySelectorAll('.hint');const h=m[m.length-1];
    try{navigator.clipboard.writeText(code).then(()=>{h.textContent='Код скопирован.'},()=>{h.textContent='Скопируйте код из поля вручную.'})}catch(_){h.textContent='Скопируйте код из поля вручную.'}
  }
  else if(a==='imp'){
    try{const o=JSON.parse(decodeURIComponent(escape(atob($('#io').value.trim()))));
      if(!o||typeof o.st!=='object')throw 0;
      S.st=o.st;S.notes=o.notes||{};S.sr=o.sr||{};S.xp=o.xp||0;S.days=o.days||{};S.best=o.best||0;S.ts=Date.now();if(!o.sr){const t=dn();for(const i in S.st)S.sr[i]=S.st[i]===1?[1,t+1,0]:[0,t,0]}save();deck=[];pos=0;Q=null;wd=[];wp=0;msg='Загружено слов с отметкой: '+Object.keys(S.st).length;
    }catch(_){msg='Код не подошёл. Проверьте, что он скопирован целиком.'}
    rStats();
  }
  else if(a==='reset'){if(rs){S.st={};S.sr={};S.xp=0;S.days={};S.best=0;S.dq={};S.wkb=0;S.ts=Date.now();save();rs=false;deck=[];pos=0;Q=null;wd=[];wp=0;sd=[];sp=0}else rs=true;rStats()}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.matches||!t.matches('textarea[data-i]'))return;
  S.notes=S.notes||{};S.notes[t.dataset.i]=t.value;S.ts=Date.now();save();
  const n=t.closest('details').querySelector('.nt');if(n)n.textContent=t.value?'📝':'';
});
if(TG)cloudPull();
go();
</script></body></html>
