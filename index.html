<style>

nav{position:fixed;z-index:10;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 24px),456px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 6px 24px #0002}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}

.qm-switch .chip{width:100%;min-height:52px;border-radius:13px;font-size:16px;font-weight:600}
.qm-switch .chip.on{background:color-mix(in srgb,var(--pri) 10%,var(--card));font-weight:700}
.write-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 12px}
.write-modes .chip{width:100%;min-height:60px;border:2px solid var(--line);border-radius:14px;padding:8px 4px;font-size:clamp(13px,4vw,16px);font-weight:600;line-height:1.2;white-space:normal}
.write-modes .chip.on{border-color:var(--pri);background:var(--pri);color:var(--onpri);font-weight:700}
.cnt{text-align:center;color:var(--mut);font-size:14px;margin:6px 0}
.stage{height:360px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.card{position:relative;width:100%;height:340px;background:var(--card);border:2px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;user-select:none;touch-action:pan-y;cursor:grab;transition:transform .2s}

.py{font-size:26px;color:var(--pri);font-weight:600}
.tr{font-size:24px;line-height:1.3}
.card .tr.f{font-size:32px;font-weight:600}
.spk{position:absolute;right:12px;top:12px;width:44px;height:44px;border:0;background:none;font-size:24px;padding:8px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button,.big{flex:1;border:0;border-radius:14px;padding:16px;font:700 17px inherit;color:#fff}
.no{background:var(--bad)}.yes{background:var(--ok)}
.big{background:var(--pri);color:var(--onpri)}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 0}
.done{text-align:center;padding:60px 10px}.done .big{width:100%;margin-top:18px}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qh{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.q{text-align:center;padding:26px 0 18px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.q .hz{font-size:84px}.q .tr{font-size:30px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:15px;font:500 18px inherit;text-align:center}
.opt .oh{font-family:"Songti SC","Noto Serif SC",serif;font-size:30px;font-weight:700}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.ban{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:16px;padding:14px;border-radius:14px;border:2px solid}
.ban.ok{border-color:var(--ok)}.ban.bad{border-color:var(--bad)}
.ban b{font-size:17px}.ban div div{font-size:14px;color:var(--mut);margin-top:3px}
.ban .big{flex:none;padding:12px 18px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center}
.st b{display:block;font-size:28px}.st span{font-size:13px;color:var(--mut)}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.rst{width:100%;margin-top:22px;background:none;border:2px solid var(--bad);color:var(--bad);border-radius:14px;padding:14px;font:600 16px inherit}
[hidden]{display:none!important}
.btns .clr{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:16px 18px}
.wq{text-align:center;margin-top:10px}
.pad{position:relative;width:100%;aspect-ratio:1.25;background-color:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;margin:10px 0;background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","Noto Serif SC",serif;font-weight:700;color:var(--pri);opacity:0;transform:scale(.94);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1),filter .4s;pointer-events:none;white-space:nowrap}
.ghost.on{opacity:.35;transform:scale(1)}
.ghost.mastered{opacity:1;filter:none}
.sq{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:16px inherit;margin:4px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:7px 0}
.row summary{display:flex;align-items:center;gap:10px;padding:10px 12px;list-style:none;cursor:pointer}
.row summary::-webkit-details-marker{display:none}
.rh{font-family:"Songti SC","Noto Serif SC",serif;font-size:26px;font-weight:700;min-width:64px}
.rt{flex:1;font-size:15px;line-height:1.35}.rt b{color:var(--pri);font-weight:600}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--mut);font:700 18px inherit;flex:none;padding:0}
.dot.s1{border-color:var(--ok);color:var(--ok)}.dot.s2{border-color:var(--bad);color:var(--bad)}
.rb{padding:0 12px 12px;display:grid;gap:8px}
.rb textarea,.io{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:15px inherit;resize:vertical}
.h3{margin:26px 0 6px;font-size:17px}
.left{text-align:left}
#toast{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
button:disabled{opacity:.6}
.spk-card{background:var(--card);border:2px solid var(--line);border-radius:22px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;margin:8px 0 12px}
.py.big{font-size:46px}
.hintbox{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.hintbox .hz{font-size:60px}
.skip{width:100%;min-height:44px;margin-top:12px;background:none;border:0;color:var(--mut);text-decoration:underline;font:15px inherit;padding:10px}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#bar{display:flex;justify-content:space-between;gap:6px;margin:8px 2px 0;font-size:13px;font-weight:600;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.qst{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.qst.dn{border-color:var(--ok)}.qt{display:flex;justify-content:space-between;font-size:15px}
.qst .prog{margin:8px 0 4px}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;opacity:.4}
.bg.on{opacity:1;border-color:var(--ok)}.bg b{display:block;font-size:20px}.bg span{font-size:12px;color:var(--mut)}
.chips.cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}.cats .chip{flex:none}
.ly{display:inline-flex;gap:6px;vertical-align:middle;margin:4px}.ly.c{flex-direction:column}
.sl{min-width:68px;height:68px;padding:0 6px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--card)}
.sl.f{border:2px solid var(--ok)}.sl.q{border:2px solid var(--pri);color:var(--pri)}
.pzw{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin:18px 0;gap:4px}.wc{font-size:64px}.wc.ok{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.tiles .opt{font-size:34px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.mc{display:flex;flex-direction:column;gap:10px}
.mtile{min-height:68px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 6px;font:500 17px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mtile b{font-weight:600}.mtile .mh{font-size:28px}.mtile small{font-size:14px;color:var(--mut)}
.mtile.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.mtile.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));opacity:.55}
.mtile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}

  nav{position:sticky;left:auto;bottom:auto;transform:none;width:auto;grid-column:1;grid-row:1/4;display:flex;flex-direction:column;align-items:stretch;gap:6px;border-radius:18px;padding:10px;box-shadow:none}

}

.tile{font:500 26px inherit;padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--ink)}.tile.ghost{display:inline-block;opacity:.25;border-style:dashed}

.tbtns{display:grid;gap:8px;margin:12px 0}.tbtns.t4{grid-template-columns:repeat(2,minmax(0,1fr))}.tbtns.t5{grid-template-columns:repeat(3,minmax(0,1fr))}.tbtn{min-height:84px;padding:6px 2px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}.tbtn svg,.tsl svg{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.tbtn svg{width:36px;height:24px}.tbtn b{font-size:20px}.tbtn small{font-size:12px;color:var(--mut)}.tspk{margin:6px auto 10px;display:block;width:auto;padding:12px 22px}
@media(min-width:600px){
  .subnav{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tbtns.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tbtns.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
}
.spk-card .py.big{overflow-wrap:anywhere}.hintbox .hz{font-size:clamp(30px,9vw,56px);overflow-wrap:anywhere}

const INT=[0,1,2,4,8,16],dn=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};

function streak(){let t=dn(),c=0;if(!S.days[t])t--;while(S.days[t]){c++;t--}return c}
function bar(){const b=$('#bar');if(!b)return;b.innerHTML=`<span>🥟 ${streak()}</span><span>Ур. ${S.xp/200+1|0}</span><span>Сегодня ${S.days[dn()]||0}/20</span><span>Очередь ${dueN()}</span>`}
function grade(i,ok){
  const t=dn(),was=isDue(i),r=S.sr[i]||[0,t,0];
  if(ok){r[0]=Math.min(5,r[0]+1);r[1]=t+INT[r[0]]}else{r[0]=Math.max(0,r[0]-2);r[1]=t;r[2]=(r[2]||0)+1}

  S.dq.n++;if(ok)S.dq.ok++;if(was)S.dq.rev++;
  QS.forEach(([k,g,l,x])=>{if(S.dq[k]>=g&&!S.dq.c[k]){S.dq.c[k]=1;S.xp+=x;toast('Квест выполнен: '+l+'. +'+x+' очков')}});
  const s=streak();if(s>S.best)S.best=s;
  if(s<7)S.wkb=0;else if(Math.floor(s/7)>S.wkb){S.wkb=Math.floor(s/7);S.xp+=100;toast('Неделя подряд! +100 очков')}

  else if(a==='catx'){S.cat='';save();rst0();go()}
  else if(a==='wm'){S.wm=v;save();pz=null;go()}
  else if(a==='pzp')pzTap(+v)
  else if(a==='pznext'){pzp++;pz=null;rPz()}
  else if(a==='pzagain'){pzd=[];pzp=0;pz=null;rPz()}
  else if(a==='qm'){S.qm=v;save();M=null;P=null;B=null;Q=null;go()}
  else if(a==='mt')mTap(v)
  else if(a==='ms'){S.ms=((S.ms||0)+1)%3;save();rMatch()}
  else if(a==='popt')pPick(+v)
  else if(a==='pnext'){P.i++;P.pick=null;if(P.i<P.list.length)pOpts();rPhrase()}
  else if(a==='pspk')say(P.list[P.i],P.ex[0])
  else if(a==='bt'){B.ans.push(+v);rBuild()}
  else if(a==='at'){B.ans=B.ans.filter(x=>x!==+v);rBuild()}
  else if(a==='bchk'){const ok=B.ans.map(j=>B.bank[j]).join('')===B.ex[0],w=B.list[B.i];B.chk=ok;if(ok)B.ok++;S.st[w]=ok?1:2;grade(w,ok);save();rBuild()}
  else if(a==='bnext'){B.i++;if(B.i<B.list.length)bSet();rBuild()}
  else if(a==='bspk')say(B.list[B.i],B.ex[0])
  else if(a==='tsel'){T.sel=+v;rTone()}
  else if(a==='tp'){if(T.sel<0||T.chk!==null)return;T.pick[T.sel]=+v;const n=T.pick.findIndex((x,j)=>!x&&j>T.sel),f=T.pick.indexOf(0);T.sel=n>=0?n:f>=0?f:T.sel;rTone()}
  else if(a==='tchk'){const w=D[T.list[T.i]][0],sy=TN[T.list[T.i]];T.chk=sy.map((s,j)=>okT(w,sy,j).has(T.pick[j]));T.sand=sy.some((s,j)=>T.chk[j]&&T.pick[j]!==s[1]);const ok=T.chk.every(Boolean);if(ok)T.ok++;gradeTone(T.list[T.i],ok);rTone()}
  else if(a==='tnext'){T.i++;if(T.i<T.list.length)tSet();rTone()}
  else if(a==='tsay')say(T.list[T.i])
  else if(a==='tnew'){tNew();rTone()}
  else if(a==='tm'){S.tm=v;save();T=null;go()}
  else if(a==='sm'){S.sm=v;save();sd=[];sp=0;go()}
  else if(a==='sl'){S.sl=((S.sl||0)+1)%3;save();S.tab==='speak'?rSpeak():go()}
  else if(a==='ext'){try{TG.openLink(location.href)}catch(_){}}
  else if(a==='exp'){
    const code=btoa(unescape(encodeURIComponent(JSON.stringify({st:S.st,notes:S.notes||{},sr:S.sr,xp:S.xp,days:S.days,best:S.best}))));
    const io=$('#io');io.value=code;io.select();
    const m=document.querySelectorAll('.hint');const h=m[m.length-1];
    try{navigator.clipboard.writeText(code).then(()=>{h.textContent='Код скопирован.'},()=>{h.textContent='Скопируйте код из поля вручную.'})}catch(_){h.textContent='Скопируйте код из поля вручную.'}
  }
  else if(a==='imp'){
    try{const o=JSON.parse(decodeURIComponent(escape(atob($('#io').value.trim()))));
      if(!o||typeof o.st!=='object')throw 0;
      S.st=o.st;S.notes=o.notes||{};S.sr=o.sr||{};S.xp=o.xp||0;S.days=o.days||{};S.best=o.best||0;S.ts=Date.now();if(!o.sr){const t=dn();for(const i in S.st)S.sr[i]=S.st[i]===1?[1,t+1,0]:[0,t,0]}save();deck=[];pos=0;Q=null;wd=[];wp=0;msg='Загружено слов с отметкой: '+Object.keys(S.st).length;
    }catch(_){msg='Код не подошёл. Проверьте, что он скопирован целиком.'}
    rStats();
  }
  else if(a==='reset'){if(rs){S.st={};S.sr={};S.xp=0;S.days={};S.best=0;S.dq={};S.wkb=0;S.ts=Date.now();save();rs=false;deck=[];pos=0;Q=null;wd=[];wp=0;sd=[];sp=0}else rs=true;rStats()}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.matches||!t.matches('textarea[data-i]'))return;
  S.notes=S.notes||{};S.notes[t.dataset.i]=t.value;S.ts=Date.now();save();
  const n=t.closest('details').querySelector('.nt');if(n)n.textContent=t.value?'📝':'';
});
if(TG)cloudPull();
go();
</script></body></html>
